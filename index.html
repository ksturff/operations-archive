<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Online Operations Archive</title>
<style>
  :root{
    --paper: #EDEDE4;
    --paper-line: #DBDBCC;
    --ink: #21261F;
    --ink-soft: #565C51;
    --card: #F7F7F0;
    --accent: #2E6B5E;
    --accent-soft: #DCE9E4;
    --stamp: #9B3B34;
    --stamp-soft: #F3E1DF;
    --tab-idle: #D9D9CB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 28px,
      var(--paper);
    color:var(--ink);
    font-family: 'Courier New', ui-monospace, Menlo, monospace;
    min-height:100vh;
  }
  header{
    padding:32px 24px 8px;
    max-width:860px;
    margin:0 auto;
  }
  h1{
    font-size:22px;
    letter-spacing:0.5px;
    margin:0 0 4px;
    font-weight:700;
  }
  header p{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 20px;
    font-style:italic;
  }
  .phase-rail{
    display:flex;
    overflow-x:auto;
    gap:6px;
    max-width:860px;
    margin:0 auto;
    padding:0 24px 0;
  }
  .phase-tab{
    flex:0 0 auto;
    padding:8px 12px;
    background:var(--tab-idle);
    border:1px solid var(--ink);
    border-bottom:none;
    border-radius:5px 5px 0 0;
    font-size:11px;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    top:1px;
  }
  .phase-tab.active{
    background:var(--card);
    font-weight:700;
  }
  .phase-tab .yr{
    color:var(--ink-soft);
    font-size:10px;
  }
  main{
    max-width:860px;
    margin:0 auto;
    border-top:1px solid var(--ink);
    background:var(--card);
    padding:24px;
    min-height:500px;
  }
  .phase-head{
    margin-bottom:20px;
    padding-bottom:14px;
    border-bottom:1px dashed var(--paper-line);
  }
  .phase-head .num{
    font-size:11px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:1px;
  }
  .phase-head h2{
    margin:2px 0 4px;
    font-size:18px;
  }
  .phase-head .yr{
    font-size:12px;
    color:var(--ink-soft);
  }
  .file-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:12px;
  }
  .file-card{
    border:1px solid var(--ink);
    background:var(--paper);
    padding:12px 14px;
    border-radius:3px;
    cursor:pointer;
    transition:transform .1s;
  }
  .file-card:hover{
    transform:translateY(-2px);
  }
  .file-card .code{
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:1px;
  }
  .file-card .title{
    font-size:14px;
    font-weight:700;
    margin:4px 0 8px;
  }
  .status{
    display:inline-block;
    font-size:9px;
    padding:2px 8px;
    border-radius:10px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .status.filed{
    background:var(--accent-soft);
    color:var(--accent);
  }
  .status.unfiled{
    background:var(--stamp-soft);
    color:var(--stamp);
  }
  .back-link{
    display:inline-block;
    font-size:12px;
    color:var(--accent);
    cursor:pointer;
    margin-bottom:16px;
    text-decoration:underline;
  }
  .dossier .file-title-block{
    border-bottom:2px solid var(--ink);
    padding-bottom:12px;
    margin-bottom:16px;
  }
  .dossier .code-line{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:1px;
    margin-bottom:2px;
  }
  .dossier h2{
    font-size:20px;
    margin:0 0 10px;
  }
  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    font-size:11px;
    color:var(--ink-soft);
  }
  .meta-row b{
    color:var(--ink);
  }
  .section{
    margin-bottom:20px;
  }
  .section-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--accent);
    border-bottom:1px solid var(--accent-soft);
    padding-bottom:4px;
    margin-bottom:8px;
  }
  .section p{
    font-size:13px;
    line-height:1.6;
    margin:0 0 8px;
  }
  .section ul{
    margin:0;
    padding-left:20px;
    font-size:13px;
    line-height:1.7;
  }
  .subblock{
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .subblock .sb-title{
    font-weight:700;
    font-size:13px;
    margin-bottom:4px;
  }
  .kv{
    font-size:12px;
    margin:2px 0;
  }
  .kv b{
    color:var(--ink-soft);
    font-weight:400;
  }
  .evidence-rating{
    font-size:13px;
    color:var(--stamp);
    font-weight:700;
  }
  .empty{
    color:var(--ink-soft);
    font-size:13px;
    padding:20px 0;
    text-align:center;
  }
  footer{
    max-width:860px;
    margin:0 auto;
    padding:16px 24px 48px;
    font-size:11px;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

let currentPhase = 0;
let currentOp = null;

function renderPhaseRail(){
  const rail = document.getElementById('phaseRail');
  rail.innerHTML = PHASES.map((p, i) => `
    <div class="phase-tab${i===currentPhase ? ' active':''}" data-idx="${i}">
      PHASE ${p.number}<br><span class="yr">${p.year}</span>
    </div>
  `).join('');
  rail.querySelectorAll('.phase-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentPhase = parseInt(tab.dataset.idx);
      currentOp = null;
      renderPhaseRail();
      renderMain();
    });
  });
}

function renderFileGrid(phase){
  const main = document.getElementById('main');
  const cards = phase.ops.map(code => {
    const op = OPERATIONS[code];
    if(!op) return '';
    const statusClass = op.status === 'Filed' ? 'filed' : 'unfiled';
    return `
      <div class="file-card" data-code="${code}">
        <div class="code">${code}</div>
        <div class="title">${op.title}</div>
        <span class="status ${statusClass}">${op.status.toUpperCase()}</span>
      </div>
    `;
  }).join('');

  main.innerHTML = `
    <div class="phase-head">
      <div class="num">PHASE ${phase.number}</div>
      <h2>${phase.title}</h2>
      <div class="yr">${phase.year}</div>
    </div>
    <div class="file-grid">${cards}</div>
  `;

  main.querySelectorAll('.file-card').forEach(card => {
    card.addEventListener('click', () => {
      currentOp = card.dataset.code;
      renderMain();
    });
  });
}

function renderDossier(code){
  const op = OPERATIONS[code];
  const main = document.getElementById('main');
  if(!op){
    main.innerHTML = '<div class="empty">file not found.</div>';
    return;
  }

  let html = `<div class="back-link" id="backLink">&larr; back to ${PHASES[currentPhase].title}</div>`;
  html += `<div class="dossier">`;
  html += `<div class="file-title-block">
    <div class="code-line">${code}</div>
    <h2>${op.title}</h2>
    <div class="meta-row">
      ${op.classification ? `<span><b>Classification:</b> ${op.classification}</span>` : ''}
      ${op.type ? `<span><b>Type:</b> ${op.type}</span>` : ''}
      ${op.release ? `<span><b>Release:</b> ${op.release}</span>` : ''}
      ${op.difficulty ? `<span><b>Difficulty:</b> ${op.difficulty}</span>` : ''}
      <span><b>Status:</b> ${op.status}</span>
    </div>
  </div>`;

  if(op.overview){
    html += `<div class="section"><div class="section-title">MISSION OVERVIEW</div>
      ${op.overview.target ? `<div class="kv"><b>Target:</b> ${op.overview.target}</div>` : ''}
      ${op.overview.contact ? `<div class="kv"><b>Contact:</b> ${op.overview.contact}</div>` : ''}
      ${op.overview.objective ? `<p style="margin-top:8px">${op.overview.objective}</p>` : ''}
    </div>`;
  }

  if(op.intel){
    html += `<div class="section"><div class="section-title">INTELLIGENCE SUMMARY</div><p>${op.intel}</p></div>`;
  }

  if(op.planningLocation){
    const pl = op.planningLocation;
    html += `<div class="section"><div class="section-title">PLANNING LOCATION</div>
      <div class="subblock">
        ${pl.host ? `<div class="kv"><b>Host requirement:</b> ${pl.host}</div>` : ''}
        ${pl.observation ? `<p style="margin-top:8px">${pl.observation}</p>` : ''}
        ${pl.evidenceRating ? `<div class="evidence-rating">${pl.evidenceRating}</div>` : ''}
      </div>
    </div>`;
  }

  if(op.setup && op.setup.length){
    html += `<div class="section"><div class="section-title">SETUP MISSIONS</div>`;
    op.setup.forEach(s => {
      html += `<div class="subblock">
        <div class="sb-title">${s.name}</div>
        ${s.objective ? `<div class="kv"><b>Objective:</b> ${s.objective}</div>` : ''}
        ${s.locations ? `<div class="kv"><b>Locations:</b> ${s.locations}</div>` : ''}
        ${s.intel ? `<div class="kv"><b>Intel gathered:</b> ${s.intel}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  if(op.finalOperation){
    html += `<div class="section"><div class="section-title">FINAL OPERATION</div>`;
    if(op.finalOperation.roles){
      op.finalOperation.roles.forEach(r => {
        html += `<div class="subblock"><div class="sb-title">${r.role}</div><div class="kv">${r.duties}</div></div>`;
      });
    }
    html += `</div>`;
  }

  if(op.equipment){
    html += `<div class="section"><div class="section-title">EQUIPMENT</div>`;
    if(op.equipment.required){
      html += `<div class="kv"><b>Required</b></div><ul>${op.equipment.required.map(e=>`<li>${e}</li>`).join('')}</ul>`;
    }
    if(op.equipment.recommended){
      html += `<div class="kv"><b>Recommended</b></div><ul>${op.equipment.recommended.map(e=>`<li>${e}</li>`).join('')}</ul>`;
    }
    html += `</div>`;
  }

  if(op.organizations && op.organizations.length){
    html += `<div class="section"><div class="section-title">ORGANIZATIONS INVOLVED</div>`;
    op.organizations.forEach(o => {
      html += `<div class="subblock"><div class="sb-title">${o.name}</div><div class="kv">${o.role}</div></div>`;
    });
    html += `</div>`;
  }

  if(op.lore && op.lore.length){
    html += `<div class="section"><div class="section-title">LORE CONNECTIONS</div>`;
    op.lore.forEach(l => {
      html += `<div class="subblock"><div class="sb-title">${l.name}</div><div class="kv">${l.note}</div></div>`;
    });
    html += `</div>`;
  }

  if(op.environmentalEvidence){
    const ev = op.environmentalEvidence;
    html += `<div class="section"><div class="section-title">ENVIRONMENTAL EVIDENCE</div>
      <div class="subblock">
        <div class="sb-title">${ev.title}</div>
        ${ev.observation ? `<div class="kv"><b>Observation:</b> ${ev.observation}</div>` : ''}
        ${ev.theory ? `<div class="kv" style="margin-top:6px"><b>Theory:</b> ${ev.theory}</div>` : ''}
        ${ev.confidence ? `<div class="kv" style="margin-top:6px"><b>Confidence:</b> ${ev.confidence}</div>` : ''}
      </div>
    </div>`;
  }

  if(op.notes && op.notes.length){
    html += `<div class="section"><div class="section-title">FIELD NOTES</div><ul>${op.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
  }

  html += `</div>`;
  main.innerHTML = html;

  document.getElementById('backLink').addEventListener('click', () => {
    currentOp = null;
    renderMain();
  });
}

function renderMain(){
  if(currentOp){
    renderDossier(currentOp);
  } else {
    renderFileGrid(PHASES[currentPhase]);
  }
}

renderPhaseRail();
renderMain();
</script>

</body>
</html>
