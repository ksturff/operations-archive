<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Online Operations Archive</title>
<style>
  :root{
    --paper: #1B1F1A;
    --paper-line: #2B3129;
    --ink: #E9E7DC;
    --ink-soft: #9BA396;
    --card: #22261F;
    --accent: #5FBFA0;
    --accent-soft: #1F3830;
    --stamp: #E2685C;
    --stamp-soft: #3A211D;
    --tab-idle: #2A2F28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 28px,
      var(--paper);
    color:var(--ink);
    font-family: 'Courier New', ui-monospace, Menlo, monospace;
    min-height:100vh;
  }
  header{
    padding:32px 24px 8px;
    max-width:860px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
  }
  h1{
    font-size:22px;
    letter-spacing:0.5px;
    margin:0 0 4px;
    font-weight:700;
  }
  header p{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 20px;
    font-style:italic;
  }
  button, .btn{
    font-family:inherit;
    font-size:12px;
    padding:8px 14px;
    border:1px solid var(--ink);
    background:var(--tab-idle);
    color:var(--ink);
    border-radius:4px;
    cursor:pointer;
  }
  button:hover{ background:var(--accent-soft); }
  .phase-rail{
    display:flex;
    overflow-x:auto;
    gap:6px;
    max-width:860px;
    margin:0 auto;
    padding:0 24px 0;
  }
  .phase-tab{
    flex:0 0 auto;
    padding:8px 12px;
    background:var(--tab-idle);
    border:1px solid var(--ink);
    border-bottom:none;
    border-radius:5px 5px 0 0;
    font-size:11px;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    top:1px;
  }
  .phase-tab.active{ background:var(--card); font-weight:700; }
  .phase-tab .yr{ color:var(--ink-soft); font-size:10px; }
  main{
    max-width:860px;
    margin:0 auto;
    border-top:1px solid var(--ink);
    background:var(--card);
    padding:24px;
    min-height:500px;
  }
  .phase-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:20px;
    padding-bottom:14px;
    border-bottom:1px dashed var(--paper-line);
    flex-wrap:wrap;
    gap:10px;
  }
  .phase-head .num{ font-size:11px; color:var(--accent); font-weight:700; letter-spacing:1px; }
  .phase-head h2{ margin:2px 0 4px; font-size:18px; }
  .phase-head .yr{ font-size:12px; color:var(--ink-soft); }
  .file-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:12px;
  }
  .file-card{
    border:1px solid var(--ink);
    background:var(--paper);
    padding:12px 14px;
    border-radius:3px;
    cursor:pointer;
    transition:transform .1s;
  }
  .file-card:hover{ transform:translateY(-2px); }
  .file-card .code{ font-size:10px; color:var(--ink-soft); letter-spacing:1px; }
  .file-card .title{ font-size:14px; font-weight:700; margin:4px 0 8px; }
  .status{ display:inline-block; font-size:9px; padding:2px 8px; border-radius:10px; font-weight:700; letter-spacing:0.5px; }
  .status.filed{ background:var(--accent-soft); color:var(--accent); }
  .status.unfiled{ background:var(--stamp-soft); color:var(--stamp); }
  .back-link{ display:inline-block; font-size:12px; color:var(--accent); cursor:pointer; margin-bottom:16px; text-decoration:underline; }
  .dossier .file-title-block{ border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:16px; }
  .dossier .code-line{ font-size:11px; color:var(--ink-soft); letter-spacing:1px; margin-bottom:2px; }
  .dossier h2{ font-size:20px; margin:0 0 10px; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:16px; font-size:11px; color:var(--ink-soft); }
  .meta-row b{ color:var(--ink); }
  .section{ margin-bottom:20px; }
  .section-title{ font-size:12px; font-weight:700; letter-spacing:1px; color:var(--accent); border-bottom:1px solid var(--accent-soft); padding-bottom:4px; margin-bottom:8px; }
  .section p{ font-size:13px; line-height:1.6; margin:0 0 8px; }
  .section ul{ margin:0; padding-left:20px; font-size:13px; line-height:1.7; }
  .subblock{ background:var(--paper); border:1px solid var(--paper-line); border-radius:4px; padding:10px 12px; margin-bottom:10px; }
  .subblock .sb-title{ font-weight:700; font-size:13px; margin-bottom:4px; }
  .kv{ font-size:12px; margin:2px 0; }
  .kv b{ color:var(--ink-soft); font-weight:400; }
  .evidence-rating{ font-size:13px; color:var(--stamp); font-weight:700; }
  .empty{ color:var(--ink-soft); font-size:13px; padding:20px 0; text-align:center; }
  footer{ max-width:860px; margin:0 auto; padding:16px 24px 48px; font-size:11px; color:var(--ink-soft); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(33,38,31,0.5);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:var(--card); border:1px solid var(--ink); border-radius:6px;
    padding:24px; max-width:680px; width:100%;
  }
  .modal h3{ margin:0 0 16px; font-size:16px; }
  .fieldset{
    border:1px solid var(--paper-line); border-radius:5px;
    padding:12px 14px; margin-bottom:14px;
  }
  .fieldset legend{
    font-size:11px; font-weight:700; letter-spacing:0.5px; color:var(--accent);
    padding:0 6px;
  }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; font-family:inherit; font-size:13px; padding:8px;
    border:1px solid var(--paper-line); border-radius:4px; background:var(--paper); color:var(--ink);
  }
  .field textarea{ min-height:70px; resize:vertical; }
  .row-block{
    display:flex; gap:6px; margin-bottom:6px; align-items:flex-start;
  }
  .row-block input{
    flex:1; font-family:inherit; font-size:12px; padding:6px 8px;
    border:1px solid var(--paper-line); border-radius:4px; background:var(--paper); color:var(--ink);
  }
  .remove-row{
    flex:0 0 auto; font-size:11px; padding:6px 10px; border:1px solid var(--ink);
    background:var(--stamp-soft); color:var(--stamp); border-radius:4px; cursor:pointer;
  }
  .add-row{
    font-size:11px; padding:6px 12px; border:1px dashed var(--ink); background:transparent;
    border-radius:4px; cursor:pointer; color:var(--ink-soft);
  }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .status-msg{ font-size:12px; margin-top:10px; }
  .status-msg.ok{ color:var(--accent); }
  .status-msg.err{ color:var(--stamp); }
  .token-note{ font-size:11px; color:var(--ink-soft); margin-top:4px; }

  .photo-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .photo-thumb-wrap{ position:relative; width:84px; height:84px; }
  .photo-thumb-wrap img{
    width:100%; height:100%; object-fit:cover;
    border:1px solid var(--ink); border-radius:4px;
  }
  .photo-thumb-wrap.uploading img{ opacity:0.4; }
  .photo-thumb-wrap .spinner-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:9px; color:var(--ink-soft); text-align:center; padding:4px;
  }
  .photo-remove{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; line-height:16px;
    text-align:center; padding:0; font-size:11px; border-radius:50%;
    background:var(--stamp-soft); color:var(--stamp); border:1px solid var(--ink);
  }
  .photo-upload-btn{
    width:84px; height:84px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:4px; font-size:10px; text-align:center;
    border:1px dashed var(--ink); border-radius:4px; background:transparent;
    color:var(--ink-soft); cursor:pointer;
  }
  .photo-upload-btn:hover{ background:var(--accent-soft); color:var(--accent); }
  .photo-url-row{ display:flex; gap:6px; margin-top:4px; }
  .photo-url-row input{ flex:1; }
  .photo-note{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>// gta online operations archive</h1>
    <p>operation files: the complete criminal history of los santos</p>
  </div>
  <button id="addBtn">+ add operation</button>
</header>

<div class="phase-rail" id="phaseRail"></div>
<main id="main"><div class="empty">loading archive…</div></main>

<footer>data lives in data.json in this repo. use "+ add operation" to file a new one from the browser, or edit data.json directly for bigger changes.</footer>

<div id="modalRoot"></div>

<script>
// ---------------------------------------------------------
// CONFIGURE THESE TWO before deploying — they must match
// your actual GitHub username and repo name.
// ---------------------------------------------------------
const REPO_OWNER = "ksturff";
const REPO_NAME  = "operations-archive";
const DATA_PATH  = "data.json";
// ---------------------------------------------------------

let DATA = { phases: [], operations: {} };
let currentPhase = 0;
let currentOp = null;
let currentPart = null;
let currentSubOp = null;
let currentGroup = null;

async function loadData(){
  try{
    const res = await fetch(DATA_PATH + '?t=' + Date.now());
    DATA = await res.json();
  }catch(e){
    document.getElementById('main').innerHTML = '<div class="empty">couldn\'t load data.json — make sure it\'s in the same repo as this file.</div>';
    return;
  }
  renderPhaseRail();
  renderMain();
}

function renderPhaseRail(){
  const rail = document.getElementById('phaseRail');
  rail.innerHTML = DATA.phases.map((p, i) => `
    <div class="phase-tab${i===currentPhase ? ' active':''}" data-idx="${i}">
      PHASE ${p.number}<br><span class="yr">${p.year}</span>
    </div>
  `).join('');
  rail.querySelectorAll('.phase-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentPhase = parseInt(tab.dataset.idx);
      currentOp = null;
      currentPart = null;
      currentSubOp = null;
      currentGroup = null;
      renderPhaseRail();
      renderMain();
    });
  });
}

function renderFileGrid(phase){
  const main = document.getElementById('main');
  const cards = (phase.ops || []).map(code => {
    const op = DATA.operations[code];
    if(!op) return '';
    const statusClass = op.status === 'Filed' ? 'filed' : 'unfiled';
    return `
      <div class="file-card" data-code="${code}">
        <div class="code">${code}</div>
        <div class="title">${op.title}</div>
        <span class="status ${statusClass}">${op.status.toUpperCase()}</span>
      </div>
    `;
  }).join('');

  main.innerHTML = `
    <div class="phase-head">
      <div>
        <div class="num">PHASE ${phase.number}</div>
        <h2>${phase.title}</h2>
        <div class="yr">${phase.year}</div>
      </div>
    </div>
    <div class="file-grid">${cards || '<div class="empty">no operations filed in this phase yet.</div>'}</div>
  `;

  main.querySelectorAll('.file-card').forEach(card => {
    card.addEventListener('click', () => {
      currentOp = card.dataset.code;
      currentPart = null;
      currentSubOp = null;
      currentGroup = null;
      renderMain();
    });
  });
}

// Break an operation into its navigable parts: an Intro (background/
// planning info), one card per Setup Mission, and a Finale.
function buildParts(op){
  const parts = [];
  const hasIntro = op.overview || op.intel || op.dialogue || op.planningLocation ||
    (op.organizations && op.organizations.length) || (op.lore && op.lore.length) ||
    op.environmentalEvidence || (op.notes && op.notes.length);
  if(hasIntro){
    parts.push({ id: 'intro', title: 'Intro', subtitle: op.classification || op.type || 'background' });
  }
  (op.setup || []).forEach((s, i) => {
    // "Vault Contents" is a shared scoping stage that now shows up as its
    // own card *inside* every approach's detail page instead of as a
    // separate top-level card here — so skip it on the main list.
    if(s.name === 'Vault Contents') return;
    parts.push({ id: 'setup-' + i, title: s.name || ('Setup mission ' + (i+1)), subtitle: 'setup mission' });
  });
  if(op.finalOperation && (op.finalOperation.roles || op.finalOperation.dialogue) || op.equipment){
    parts.push({ id: 'finale', title: 'Finale', subtitle: 'final operation' });
  }
  return parts;
}

// Protagonist colour coding used across the archive: Michael = blue,
// Franklin = green, Trevor = orange.
const PROTAGONIST_COLORS = { Michael: '#4FA8E0', Franklin: '#5FBF5F', Trevor: '#FF8C1A' };
const PROTAGONIST_ORDER = ['Michael', 'Franklin', 'Trevor'];

function partProtagonist(op, part){
  if(!part.id.startsWith('setup-')) return null;
  const i = parseInt(part.id.split('-')[1], 10);
  const s = (op.setup || [])[i];
  return s ? (s.protagonist || null) : null;
}

function renderOperationCards(code){
  const op = DATA.operations[code];
  const main = document.getElementById('main');
  if(!op){
    main.innerHTML = '<div class="empty">file not found.</div>';
    return;
  }
  const parts = buildParts(op);
  const hasProtagonistGroups = parts.some(p => partProtagonist(op, p));

  const backRow = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
      <div class="back-link" id="backLink">&larr; back to ${DATA.phases[currentPhase].title}</div>
      <div style="display:flex; gap:8px;">
        <button id="editOpBtn">edit</button>
        <button id="deleteOpBtn">delete</button>
      </div>
    </div>`;
  const headBlock = `
    <div class="phase-head">
      <div>
        <div class="num">${code}</div>
        <h2>${op.title}</h2>
        <div class="yr">${op.release || ''}${op.release && op.status ? ' · ' : ''}${op.status || ''}</div>
      </div>
    </div>`;

  // Diamond Casino Heist (and anything else with protagonist-tagged setup
  // missions): show a Michael / Franklin / Trevor group screen first, then
  // that protagonist's own approach cards.
  if(hasProtagonistGroups && !currentGroup){
    const groupCards = PROTAGONIST_ORDER.map(name => {
      const color = PROTAGONIST_COLORS[name];
      return `
        <div class="file-card protagonist-card" data-group="${name}" style="border-left:4px solid ${color};">
          <div class="code" style="color:${color};">${name.toUpperCase()}</div>
          <div class="title" style="color:${color};">${name}</div>
        </div>
      `;
    }).join('');

    main.innerHTML = `
      ${backRow}
      ${headBlock}
      <div class="file-grid">${groupCards}</div>
    `;

    document.getElementById('backLink').addEventListener('click', () => {
      currentOp = null;
      currentPart = null;
      currentSubOp = null;
      currentGroup = null;
      renderMain();
    });
    document.getElementById('editOpBtn').addEventListener('click', () => openOperationModal(code));
    document.getElementById('deleteOpBtn').addEventListener('click', () => deleteOperation(code));
    main.querySelectorAll('.protagonist-card').forEach(card => {
      card.addEventListener('click', () => {
        currentGroup = card.dataset.group;
        renderMain();
      });
    });
    return;
  }

  // Filter to the active protagonist's parts, if any, while keeping each
  // card's original global index so navigation into renderPartDetail
  // still works off the same parts array.
  let displayParts = parts.map((p, idx) => ({ p, idx }));
  if(hasProtagonistGroups && currentGroup){
    displayParts = displayParts.filter(({p}) => partProtagonist(op, p) === currentGroup);
  }

  const cardsHtml = displayParts.map(({p, idx}) => `
    <div class="file-card" data-idx="${idx}">
      <div class="code">${code}</div>
      <div class="title">${p.title}</div>
      <div class="kv">${p.subtitle || ''}</div>
    </div>
  `).join('');

  const groupHeadBlock = (hasProtagonistGroups && currentGroup) ? `
    <div class="phase-head">
      <div>
        <div class="num" style="color:${PROTAGONIST_COLORS[currentGroup]};">${code} — ${currentGroup.toUpperCase()}</div>
        <h2 style="color:${PROTAGONIST_COLORS[currentGroup]};">${currentGroup}</h2>
        <div class="yr">${op.release || ''}${op.release && op.status ? ' · ' : ''}${op.status || ''}</div>
      </div>
    </div>` : headBlock;

  const groupBackRow = (hasProtagonistGroups && currentGroup) ? `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
      <div class="back-link" id="backLink">&larr; back to Michael / Franklin / Trevor</div>
      <div style="display:flex; gap:8px;">
        <button id="editOpBtn">edit</button>
        <button id="deleteOpBtn">delete</button>
      </div>
    </div>` : backRow;

  main.innerHTML = `
    ${groupBackRow}
    ${groupHeadBlock}
    <div class="file-grid">${cardsHtml || '<div class="empty">no parts filed yet — click edit to add setup missions or a finale.</div>'}</div>
  `;

  document.getElementById('backLink').addEventListener('click', () => {
    if(hasProtagonistGroups && currentGroup){
      currentGroup = null;
    } else {
      currentOp = null;
      currentGroup = null;
    }
    currentPart = null;
    currentSubOp = null;
    renderMain();
  });
  document.getElementById('editOpBtn').addEventListener('click', () => openOperationModal(code));
  document.getElementById('deleteOpBtn').addEventListener('click', () => deleteOperation(code));
  main.querySelectorAll('.file-card').forEach(card => {
    card.addEventListener('click', () => {
      currentPart = parseInt(card.dataset.idx);
      currentSubOp = null;
      renderMain();
    });
  });
}

function renderPartDetail(code, partIdx){
  const op = DATA.operations[code];
  const main = document.getElementById('main');
  const parts = buildParts(op);
  const part = parts[partIdx];
  if(!op || !part){
    main.innerHTML = '<div class="empty">part not found.</div>';
    return;
  }

  let html = `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
    <div class="back-link" id="backLink">&larr; back to ${op.title}</div>
    <div style="display:flex; gap:8px;">
      <button id="editOpBtn">edit</button>
      <button id="deleteOpBtn">delete</button>
    </div>
  </div>`;
  html += `<div class="dossier">`;
  html += `<div class="file-title-block">
    <div class="code-line">${code} — ${part.title}</div>
    <h2>${part.id === 'intro' ? op.title : part.title}</h2>
  </div>`;

  if(part.id === 'intro'){
    html += `<div class="meta-row" style="margin-bottom:14px;">
      ${op.classification ? `<span><b>Classification:</b> ${op.classification}</span>` : ''}
      ${op.type ? `<span><b>Type:</b> ${op.type}</span>` : ''}
      ${op.release ? `<span><b>Release:</b> ${op.release}</span>` : ''}
      ${op.difficulty ? `<span><b>Difficulty:</b> ${op.difficulty}</span>` : ''}
      <span><b>Status:</b> ${op.status}</span>
    </div>`;
    if(op.overview){
      html += `<div class="section"><div class="section-title">MISSION OVERVIEW</div>
        ${op.overview.target ? `<div class="kv"><b>Target:</b> ${op.overview.target}</div>` : ''}
        ${op.overview.contact ? `<div class="kv"><b>Contact:</b> ${op.overview.contact}</div>` : ''}
        ${op.overview.objective ? `<p style="margin-top:8px">${op.overview.objective}</p>` : ''}
      </div>`;
    }
    if(op.intel){
      html += `<div class="section"><div class="section-title">INTELLIGENCE SUMMARY</div><p>${op.intel}</p></div>`;
    }
    html += `<div class="section"><div class="section-title">DIALOGUE</div><p style="white-space:pre-wrap;">${op.dialogue || '<span class="empty" style="padding:0;">no dialogue filed yet.</span>'}</p></div>`;
    if(op.planningLocation){
      const pl = op.planningLocation;
      html += `<div class="section"><div class="section-title">PLANNING LOCATION</div>
        <div class="subblock">
          ${pl.host ? `<div class="kv"><b>Host requirement:</b> ${pl.host}</div>` : ''}
          ${pl.observation ? `<p style="margin-top:8px">${pl.observation}</p>` : ''}
          ${pl.evidenceRating ? `<div class="evidence-rating">${pl.evidenceRating}</div>` : ''}
        </div>
      </div>`;
    }
    if(op.organizations && op.organizations.length){
      html += `<div class="section"><div class="section-title">ORGANIZATIONS INVOLVED</div>`;
      op.organizations.forEach(o => {
        html += `<div class="subblock"><div class="sb-title">${o.name}</div><div class="kv">${o.role}</div></div>`;
      });
      html += `</div>`;
    }
    if(op.lore && op.lore.length){
      html += `<div class="section"><div class="section-title">LORE CONNECTIONS</div>`;
      op.lore.forEach(l => {
        html += `<div class="subblock"><div class="sb-title">${l.name}</div><div class="kv">${l.note}</div></div>`;
      });
      html += `</div>`;
    }
    if(op.environmentalEvidence){
      const ev = op.environmentalEvidence;
      html += `<div class="section"><div class="section-title">ENVIRONMENTAL EVIDENCE</div>
        <div class="subblock">
          <div class="sb-title">${ev.title}</div>
          ${ev.observation ? `<div class="kv"><b>Observation:</b> ${ev.observation}</div>` : ''}
          ${ev.theory ? `<div class="kv" style="margin-top:6px"><b>Theory:</b> ${ev.theory}</div>` : ''}
          ${ev.confidence ? `<div class="kv" style="margin-top:6px"><b>Confidence:</b> ${ev.confidence}</div>` : ''}
        </div>
      </div>`;
    }
    if(op.notes && op.notes.length){
      html += `<div class="section"><div class="section-title">FIELD NOTES</div><ul>${op.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
    }
    if(op.photos && op.photos.length){
      html += `<div class="section"><div class="section-title">PHOTOS</div><div class="photo-grid">
        ${op.photos.map(url => `<a href="${escapeAttr(url)}" target="_blank" rel="noopener"><div class="photo-thumb-wrap"><img src="${escapeAttr(url)}" loading="lazy"></div></a>`).join('')}
      </div></div>`;
    }
  } else if(part.id.startsWith('setup-')){
    const idx = parseInt(part.id.split('-')[1]);
    const s = (op.setup || [])[idx] || {};
    const subOps = s.operations || [];

    if(subOps.length){
      // this setup mission has its own mandatory/optional sub-operations —
      // show those as their own cards instead of one flat page
      if(s.objective){
        html += `<div class="section"><div class="section-title">OVERVIEW</div><p>${s.objective}</p></div>`;
      }
      const indexed = subOps.map((o,i)=>({...o, i}));
      const cardHtml = (list) => list.map(o => `
        <div class="file-card" data-subidx="${o.i}">
          <div class="code">${o.category ? o.category.toUpperCase() : (o.mandatory ? 'MANDATORY' : 'OPTIONAL')}</div>
          <div class="title">${o.name}</div>
        </div>
      `).join('');

      if(indexed.some(o => o.category)){
        // Category-based layout (Diamond Casino Heist approach cards):
        // a fixed run of green section headers, each with its own row of
        // cards underneath — Masks is always shown even with no cards yet.
        const CATEGORY_ORDER = ['Vault Contents','Support Crew','Approach Specific Preps','General Prep Work','Security Pass','Masks'];
        const byCategory = {};
        indexed.forEach(o => {
          const cat = o.category || 'Uncategorized';
          (byCategory[cat] = byCategory[cat] || []).push(o);
        });
        // include any categories present in the data but not in the fixed
        // order, appended at the end in the order they first appear
        const seen = new Set(CATEGORY_ORDER);
        const extra = Object.keys(byCategory).filter(c => !seen.has(c));
        const orderedCats = CATEGORY_ORDER.filter(c => byCategory[c] || c === 'Masks').concat(extra);

        orderedCats.forEach(cat => {
          const items = byCategory[cat] || [];
          html += `<div class="section"><div class="section-title">${cat.toUpperCase()}</div><div class="file-grid">${items.length ? cardHtml(items) : '<div class="empty">no cards filed yet.</div>'}</div></div>`;
        });
      } else {
        // legacy mandatory/optional layout
        const mandatory = indexed.filter(o => o.mandatory);
        const optional = indexed.filter(o => !o.mandatory);
        if(mandatory.length){
          html += `<div class="section"><div class="section-title">MANDATORY OPERATIONS</div><div class="file-grid">${cardHtml(mandatory)}</div></div>`;
        }
        if(optional.length){
          html += `<div class="section"><div class="section-title">OPTIONAL OPERATIONS</div><div class="file-grid">${cardHtml(optional)}</div></div>`;
        }
      }
    } else {
      if(s.objective){
        html += `<div class="section"><div class="section-title">OBJECTIVE</div><p>${s.objective}</p></div>`;
      }
      if(s.locations){
        html += `<div class="section"><div class="section-title">LOCATIONS</div><p>${s.locations}</p></div>`;
      }
      if(s.intel){
        html += `<div class="section"><div class="section-title">INTEL GATHERED</div><p>${s.intel}</p></div>`;
      }
      html += `<div class="section"><div class="section-title">DIALOGUE</div><p style="white-space:pre-wrap;">${s.dialogue || '<span class="empty" style="padding:0;">no dialogue filed yet.</span>'}</p></div>`;
    }
  } else if(part.id === 'finale'){
    const fo = op.finalOperation || {};
    html += `<div class="section"><div class="section-title">DIALOGUE</div><p style="white-space:pre-wrap;">${fo.dialogue || '<span class="empty" style="padding:0;">no dialogue filed yet.</span>'}</p></div>`;
    if(fo.roles && fo.roles.length){
      html += `<div class="section"><div class="section-title">TEAM ROLES</div>`;
      fo.roles.forEach(r => {
        html += `<div class="subblock"><div class="sb-title">${r.role}</div><div class="kv">${r.duties}</div></div>`;
      });
      html += `</div>`;
    }
    if(op.equipment){
      html += `<div class="section"><div class="section-title">EQUIPMENT</div>`;
      if(op.equipment.required){
        html += `<div class="kv"><b>Required</b></div><ul>${op.equipment.required.map(e=>`<li>${e}</li>`).join('')}</ul>`;
      }
      if(op.equipment.recommended){
        html += `<div class="kv"><b>Recommended</b></div><ul>${op.equipment.recommended.map(e=>`<li>${e}</li>`).join('')}</ul>`;
      }
      html += `</div>`;
    }
  }

  html += `</div>`;
  main.innerHTML = html;
  document.getElementById('editOpBtn').addEventListener('click', () => openOperationModal(code));
  document.getElementById('deleteOpBtn').addEventListener('click', () => deleteOperation(code));
  document.getElementById('backLink').addEventListener('click', () => {
    currentPart = null;
    renderMain();
  });
  main.querySelectorAll('[data-subidx]').forEach(card => {
    card.addEventListener('click', () => {
      currentSubOp = parseInt(card.dataset.subidx);
      renderMain();
    });
  });
}

function renderSubOpDetail(code, partIdx, subIdx){
  const op = DATA.operations[code];
  const parts = buildParts(op);
  const part = parts[partIdx];
  const idx = parseInt(part.id.split('-')[1]);
  const s = (op.setup || [])[idx] || {};
  const subOp = (s.operations || [])[subIdx] || {};
  const main = document.getElementById('main');

  let html = `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
    <div class="back-link" id="backLink">&larr; back to ${s.name}</div>
    <div style="display:flex; gap:8px;">
      <button id="editOpBtn">edit</button>
      <button id="deleteOpBtn">delete</button>
    </div>
  </div>`;
  html += `<div class="dossier">`;
  html += `<div class="file-title-block">
    <div class="code-line">${code} — ${s.name} — ${subOp.category || (subOp.mandatory ? 'Mandatory' : 'Optional')}</div>
    <h2>${subOp.name}</h2>
  </div>`;
  if(subOp.objective){
    html += `<div class="section"><div class="section-title">OBJECTIVE</div><p>${subOp.objective}</p></div>`;
  }
  if(subOp.locations){
    html += `<div class="section"><div class="section-title">LOCATIONS</div><p>${subOp.locations}</p></div>`;
  }
  if(subOp.intel){
    html += `<div class="section"><div class="section-title">INTEL GATHERED</div><p>${subOp.intel}</p></div>`;
  }
  html += `<div class="section"><div class="section-title">DIALOGUE</div><p style="white-space:pre-wrap;">${subOp.dialogue || '<span class="empty" style="padding:0;">no dialogue filed yet.</span>'}</p></div>`;
  html += `</div>`;
  main.innerHTML = html;
  document.getElementById('editOpBtn').addEventListener('click', () => openOperationModal(code));
  document.getElementById('deleteOpBtn').addEventListener('click', () => deleteOperation(code));
  document.getElementById('backLink').addEventListener('click', () => {
    currentSubOp = null;
    renderMain();
  });
}

function renderMain(){
  if(currentSubOp !== null){
    renderSubOpDetail(currentOp, currentPart, currentSubOp);
  } else if(currentPart !== null){
    renderPartDetail(currentOp, currentPart);
  } else if(currentOp){
    renderOperationCards(currentOp);
  } else if(DATA.phases[currentPhase]){
    renderFileGrid(DATA.phases[currentPhase]);
  }
}

function escapeAttr(str){
  return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// Generic repeatable-row list editor. `state` is a plain array that this
// function mutates in place. `fieldDefs` is null for a simple string list,
// or an array of {key,label} for a list of small objects.
// Setup Missions get their own editor (not the generic list one) because
// each mission can optionally break down further into its own mandatory/
// optional sub-operations — e.g. Diamond Casino Heist's approach preps.
function renderSetupList(){
  const container = document.getElementById('listSetup');
  const fields = ['name','objective','locations','intel','dialogue'];

  function subOpBlock(i, o, j){
    return `<div class="subop-block" data-parent="${i}" data-subidx="${j}" style="border:1px solid var(--paper-line); border-radius:4px; padding:8px; margin:6px 0 6px 18px; background:var(--card);">
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <select data-subkey="mandatory" style="flex:0 0 110px; font-family:inherit; font-size:12px; padding:6px; border:1px solid var(--paper-line); border-radius:4px;">
          <option value="true" ${o.mandatory ? 'selected' : ''}>Mandatory</option>
          <option value="false" ${!o.mandatory ? 'selected' : ''}>Optional</option>
        </select>
        <input data-subkey="category" placeholder="Category (e.g. Support Crew)" value="${escapeAttr(o.category || '')}" style="flex:0 0 170px;">
        <input data-subkey="name" placeholder="Name" value="${escapeAttr(o.name)}" style="flex:1;">
        <button type="button" class="remove-subop" data-parent="${i}" data-subidx="${j}">×</button>
      </div>
      <input data-subkey="objective" placeholder="Objective" value="${escapeAttr(o.objective)}" style="margin-bottom:6px; width:100%;">
      <input data-subkey="locations" placeholder="Locations" value="${escapeAttr(o.locations)}" style="margin-bottom:6px; width:100%;">
      <input data-subkey="intel" placeholder="Intel gathered" value="${escapeAttr(o.intel)}" style="margin-bottom:6px; width:100%;">
      <textarea data-subkey="dialogue" placeholder="Dialogue" style="width:100%; min-height:60px;">${escapeAttr(o.dialogue)}</textarea>
    </div>`;
  }

  function missionBlock(s, i){
    const subOpsHtml = (s.operations || []).map((o, j) => subOpBlock(i, o, j)).join('');
    return `<div class="row-block" data-idx="${i}" style="flex-direction:column; align-items:stretch; border:1px solid var(--ink); border-radius:4px; padding:10px; margin-bottom:10px;">
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <input data-key="name" placeholder="Name" value="${escapeAttr(s.name)}" style="flex:1;">
        <button type="button" class="remove-row" data-idx="${i}">× remove mission</button>
      </div>
      <input data-key="objective" placeholder="Objective / overview" value="${escapeAttr(s.objective)}" style="margin-bottom:6px;">
      <input data-key="locations" placeholder="Locations" value="${escapeAttr(s.locations)}" style="margin-bottom:6px;">
      <input data-key="intel" placeholder="Intel gathered" value="${escapeAttr(s.intel)}" style="margin-bottom:6px;">
      <textarea data-key="dialogue" placeholder="Dialogue" style="margin-bottom:8px;">${escapeAttr(s.dialogue)}</textarea>
      <div style="border-top:1px dashed var(--paper-line); padding-top:8px;">
        <label style="font-size:11px; color:var(--ink-soft); display:block; margin-bottom:4px;">Operations within this mission — leave empty for a simple, single-page mission. Give matching operations the same Category (e.g. "Support Crew") to group them under one green section header; leave Category blank to fall back to the old Mandatory/Optional grouping.</label>
        ${subOpsHtml}
        <button type="button" class="add-subop" data-parent="${i}">+ add operation</button>
      </div>
    </div>`;
  }

  container.innerHTML = listStates.setup.map(missionBlock).join('') + `<button type="button" class="add-row">+ add setup mission</button>`;

  function syncFromDom(){
    const rows = container.querySelectorAll('.row-block');
    const newArr = [];
    rows.forEach(row => {
      const obj = {};
      fields.forEach(k => {
        const inp = row.querySelector(`[data-key="${k}"]`);
        obj[k] = inp ? inp.value : '';
      });
      const subs = [];
      row.querySelectorAll('.subop-block').forEach(subRow => {
        const subObj = { mandatory: subRow.querySelector('[data-subkey="mandatory"]').value === 'true', category: (subRow.querySelector('[data-subkey="category"]') || {}).value || '' };
        fields.forEach(k => {
          if(k === 'mandatory') return;
          const inp = subRow.querySelector(`[data-subkey="${k}"]`);
          subObj[k] = inp ? inp.value : '';
        });
        subs.push(subObj);
      });
      if(subs.length) obj.operations = subs;
      newArr.push(obj);
    });
    listStates.setup.length = 0;
    listStates.setup.push(...newArr);
  }

  container.querySelectorAll('.remove-row').forEach(btn => {
    btn.addEventListener('click', () => {
      syncFromDom();
      listStates.setup.splice(parseInt(btn.dataset.idx), 1);
      renderSetupList();
    });
  });
  container.querySelector('.add-row').addEventListener('click', () => {
    syncFromDom();
    listStates.setup.push({ name: '', objective: '', locations: '', intel: '', dialogue: '' });
    renderSetupList();
  });
  container.querySelectorAll('.add-subop').forEach(btn => {
    btn.addEventListener('click', () => {
      syncFromDom();
      const pi = parseInt(btn.dataset.parent);
      if(!listStates.setup[pi].operations) listStates.setup[pi].operations = [];
      listStates.setup[pi].operations.push({ mandatory: true, category: '', name: '', objective: '', locations: '', intel: '', dialogue: '' });
      renderSetupList();
    });
  });
  container.querySelectorAll('.remove-subop').forEach(btn => {
    btn.addEventListener('click', () => {
      syncFromDom();
      const pi = parseInt(btn.dataset.parent);
      const si = parseInt(btn.dataset.subidx);
      listStates.setup[pi].operations.splice(si, 1);
      renderSetupList();
    });
  });
}

function readSetupList(){
  const container = document.getElementById('listSetup');
  const fields = ['name','objective','locations','intel','dialogue'];
  const rows = container.querySelectorAll('.row-block');
  const newArr = [];
  rows.forEach(row => {
    const obj = {};
    fields.forEach(k => {
      const inp = row.querySelector(`[data-key="${k}"]`);
      obj[k] = inp ? inp.value : '';
    });
    const subs = [];
    row.querySelectorAll('.subop-block').forEach(subRow => {
      const subObj = { mandatory: subRow.querySelector('[data-subkey="mandatory"]').value === 'true', category: (subRow.querySelector('[data-subkey="category"]') || {}).value || '' };
      fields.forEach(k => {
        if(k === 'mandatory') return;
        const inp = subRow.querySelector(`[data-subkey="${k}"]`);
        subObj[k] = inp ? inp.value : '';
      });
      subs.push(subObj);
    });
    if(subs.length) obj.operations = subs;
    newArr.push(obj);
  });
  return newArr;
}

// Photos editor: thumbnails you can remove, an upload button that commits
// the image straight to this repo (under images/<code>/), and a fallback
// text field for pasting an already-hosted image URL.
function renderPhotosList(){
  const container = document.getElementById('listPhotos');

  function draw(){
    const thumbs = listStates.photos.map((url, idx) => `
      <div class="photo-thumb-wrap" data-idx="${idx}">
        <img src="${escapeAttr(url)}" loading="lazy">
        <button type="button" class="photo-remove" data-idx="${idx}">&times;</button>
      </div>
    `).join('');
    container.innerHTML = `
      <div class="photo-grid" id="photoGrid">
        ${thumbs}
        <button type="button" class="photo-upload-btn" id="photoUploadBtn">+<br>upload</button>
      </div>
      <div class="photo-url-row">
        <input type="text" id="photoUrlInput" placeholder="...or paste an image URL">
        <button type="button" id="photoUrlAddBtn">add</button>
      </div>
      <input type="file" id="photoFileInput" accept="image/*" style="display:none;">
      <div class="photo-note">uploads commit straight to <code>images/&lt;code&gt;/</code> in this repo using the github token above — enter that first.</div>
      <div id="photoUploadStatus"></div>
    `;

    container.querySelectorAll('.photo-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        listStates.photos.splice(parseInt(btn.dataset.idx), 1);
        draw();
      });
    });

    document.getElementById('photoUrlAddBtn').addEventListener('click', () => {
      const input = document.getElementById('photoUrlInput');
      const val = input.value.trim();
      if(val){ listStates.photos.push(val); draw(); }
    });

    document.getElementById('photoUploadBtn').addEventListener('click', () => {
      document.getElementById('photoFileInput').click();
    });

    document.getElementById('photoFileInput').addEventListener('change', async () => {
      const fileInput = document.getElementById('photoFileInput');
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;
      const token = document.getElementById('fToken').value.trim();
      const statusEl = document.getElementById('photoUploadStatus');
      if(!token){
        statusEl.innerHTML = '<div class="status-msg err">enter your github token above first.</div>';
        return;
      }
      const code = (document.getElementById('fCode').value || 'unfiled').trim() || 'unfiled';
      statusEl.innerHTML = '<div class="status-msg">uploading…</div>';
      try{
        const url = await uploadPhotoToGitHub(file, token, code);
        listStates.photos.push(url);
        statusEl.innerHTML = '';
        draw();
      }catch(e){
        statusEl.innerHTML = `<div class="status-msg err">${e.message}</div>`;
      }
    });
  }

  draw();
}

async function uploadPhotoToGitHub(file, token, code){
  const b64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('could not read the file'));
    reader.readAsDataURL(file);
  });
  const safeCode = code.replace(/[^a-zA-Z0-9_-]/g, '') || 'unfiled';
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const path = `images/${safeCode}/${Date.now()}.${ext}`;
  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
  const res = await fetch(apiUrl, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: `Add photo for ${code}`, content: b64 })
  });
  if(!res.ok){
    const errJson = await res.json().catch(()=>({}));
    throw new Error(errJson.message || 'github rejected the photo upload');
  }
  const json = await res.json();
  return (json.content && json.content.download_url) || `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${path}`;
}

function renderList(containerId, state, fieldDefs){
  const container = document.getElementById(containerId);
  const rowsHtml = state.map((item, idx) => {
    if(fieldDefs){
      return `<div class="row-block" data-idx="${idx}" style="flex-wrap:wrap;">
        ${fieldDefs.map(f => f.type === 'textarea'
          ? `<textarea data-key="${f.key}" placeholder="${f.label}" style="flex:1 1 100%; min-height:70px;">${escapeAttr(item[f.key])}</textarea>`
          : `<input type="text" data-key="${f.key}" placeholder="${f.label}" value="${escapeAttr(item[f.key])}">`
        ).join('')}
        <button type="button" class="remove-row" data-idx="${idx}">×</button>
      </div>`;
    }
    return `<div class="row-block" data-idx="${idx}">
      <input type="text" value="${escapeAttr(item)}">
      <button type="button" class="remove-row" data-idx="${idx}">×</button>
    </div>`;
  }).join('');
  container.innerHTML = rowsHtml + `<button type="button" class="add-row">+ add</button>`;

  function syncFromDom(){
    const rows = container.querySelectorAll('.row-block');
    const newArr = [];
    rows.forEach(row => {
      if(fieldDefs){
        const obj = {};
        fieldDefs.forEach(f => {
          const inp = row.querySelector(`[data-key="${f.key}"]`);
          obj[f.key] = inp ? inp.value : '';
        });
        newArr.push(obj);
      } else {
        newArr.push(row.querySelector('input').value);
      }
    });
    state.length = 0;
    state.push(...newArr);
  }

  container.querySelectorAll('.remove-row').forEach(btn => {
    btn.addEventListener('click', () => {
      syncFromDom();
      state.splice(parseInt(btn.dataset.idx), 1);
      renderList(containerId, state, fieldDefs);
    });
  });
  container.querySelector('.add-row').addEventListener('click', () => {
    syncFromDom();
    state.push(fieldDefs ? {} : '');
    renderList(containerId, state, fieldDefs);
  });
}

          <div class="field"><label>Evidence rating</label><input type="text" id="fEvidenceRating" value="${escapeAttr(pl.evidenceRating)}" placeholder="e.g. ★★★★★ Strong"></div>

        <fieldset class="fieldset">

        <fieldset class="fieldset">

        <fieldset class="fieldset">

          <div id="listRequired"></div>
        </fieldset>
        <fieldset class="fieldset">
          <legend>EQUIPMENT — RECOMMENDED</legend>
          <div id="listRecommended"></div>
        </fieldset>

        <fieldset class="fieldset">
          <legend>ORGANIZATIONS INVOLVED</legend>
          <div id="listOrgs"></div>
        </fieldset>

        <fieldset class="fieldset">
          <legend>LORE CONNECTIONS</legend>
          <div id="listLore"></div>
        </fieldset>

        <fieldset class="fieldset">
          <legend>ENVIRONMENTAL EVIDENCE</legend>
          <div class="field"><label>Title</label><input type="text" id="fEvTitle" value="${escapeAttr(ev.title)}"></div>
          <div class="field"><label>Observation</label><textarea id="fEvObservation">${escapeAttr(ev.observation)}</textarea></div>
          <div class="field"><label>Theory</label><textarea id="fEvTheory">${escapeAttr(ev.theory)}</textarea></div>
          <div class="field"><label>Confidence</label><input type="text" id="fEvConfidence" value="${escapeAttr(ev.confidence)}"></div>
        </fieldset>

        <fieldset class="fieldset">

        <div id="modalStatus"></div>
        <div class="modal-actions">
          <button id="cancelBtn">Cancel</button>
          <button id="saveBtn">Save to GitHub</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('fPhase').value = defaultPhaseIdx >= 0 ? defaultPhaseIdx : 0;

  renderSetupList();
  renderPhotosList(existingCode);
  renderList('listRoles', listStates.roles, [{key:'role',label:'Role'},{key:'duties',label:'Duties'}]);
  renderList('listRequired', listStates.required, null);
  renderList('listRecommended', listStates.recommended, null);
  renderList('listOrgs', listStates.organizations, [{key:'name',label:'Name'},{key:'role',label:'Role'}]);
  renderList('listLore', listStates.lore, [{key:'name',label:'Name'},{key:'note',label:'Note'}]);
  renderList('listNotes', listStates.notes, null);

  const savedToken = localStorage.getItem('gh_token');
  if(savedToken){
    document.getElementById('fToken').value = savedToken;
    document.getElementById('fRemember').checked = true;
  }

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') root.innerHTML = '';
  });
  document.getElementById('cancelBtn').addEventListener('click', () => root.innerHTML = '');
  document.getElementById('saveBtn').addEventListener('click', () => submitOperation(existingCode));
}

// drop empty strings/objects/arrays so data.json stays tidy and the
// dossier's conditional rendering (which checks truthiness) behaves
function pruneEmpty(val){
  if(Array.isArray(val)){
    const cleaned = val.map(pruneEmpty).filter(v => {
      if(v == null) return false;
      if(typeof v === 'string') return v.trim() !== '';
      if(typeof v === 'object') return Object.keys(v).length > 0;
      return true;
    });
    return cleaned.length ? cleaned : undefined;
  }
  if(val && typeof val === 'object'){
    const out = {};
    Object.keys(val).forEach(k => {
      const cleaned = pruneEmpty(val[k]);
      if(cleaned !== undefined && cleaned !== '') out[k] = cleaned;
    });
    return Object.keys(out).length ? out : undefined;
  }
  if(typeof val === 'string') return val.trim() === '' ? undefined : val.trim();
  return val;
}

async function commitData(newData, message, token){
  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH}`;
  const getRes = await fetch(apiUrl, { headers: { Authorization: `token ${token}` } });
  if(!getRes.ok) throw new Error('could not read current data.json (check token permissions and repo name)');
  const getJson = await getRes.json();
  const sha = getJson.sha;

  const contentStr = JSON.stringify(newData, null, 2);
  const contentB64 = btoa(unescape(encodeURIComponent(contentStr)));

  const putRes = await fetch(apiUrl, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: contentB64, sha })
  });
  if(!putRes.ok){
    const errJson = await putRes.json().catch(()=>({}));
    throw new Error(errJson.message || 'GitHub rejected the commit');
  }
}

async function submitOperation(existingCode){
  const isEdit = !!existingCode;
  const token = document.getElementById('fToken').value.trim();
  const remember = document.getElementById('fRemember').checked;
  const phaseIdx = parseInt(document.getElementById('fPhase').value);
  const code = document.getElementById('fCode').value.trim();
  const statusEl = document.getElementById('modalStatus');

  // pull final values out of the row-editors (in case the last row
  // wasn't followed by an add/remove click to sync it)
  ['listSetup','listRoles','listRequired','listRecommended','listOrgs','listLore','listNotes'].forEach(id => {});

  function readSimpleList(containerId){
    const rows = document.querySelectorAll(`#${containerId} .row-block`);
    return Array.from(rows).map(r => r.querySelector('input').value);
  }
  function readObjectList(containerId, keys){
    const rows = document.querySelectorAll(`#${containerId} .row-block`);
    return Array.from(rows).map(r => {
      const obj = {};
      keys.forEach(k => { const inp = r.querySelector(`[data-key="${k}"]`); obj[k] = inp ? inp.value : ''; });
      return obj;
    });
  }

  const rawOp = {
    title: document.getElementById('fTitle').value,
    classification: document.getElementById('fClassification').value,
    type: document.getElementById('fType').value,
    release: document.getElementById('fRelease').value,
    difficulty: document.getElementById('fDifficulty').value,
    status: document.getElementById('fStatus').value,
    overview: {
      target: document.getElementById('fTarget').value,
      contact: document.getElementById('fContact').value,
      objective: document.getElementById('fObjective').value
    },
    intel: document.getElementById('fIntel').value,
    dialogue: document.getElementById('fDialogue').value,
    planningLocation: {
      host: document.getElementById('fHost').value,
      observation: document.getElementById('fObservation').value,
      evidenceRating: document.getElementById('fEvidenceRating').value
    },
    setup: readSetupList(),
    finalOperation: {
      dialogue: document.getElementById('fFinaleDialogue').value,
      roles: readObjectList('listRoles', ['role','duties'])
    },
    equipment: {
      required: readSimpleList('listRequired'),
      recommended: readSimpleList('listRecommended')
    },
    organizations: readObjectList('listOrgs', ['name','role']),
    lore: readObjectList('listLore', ['name','note']),
    photos: listStates.photos,
    environmentalEvidence: {
      title: document.getElementById('fEvTitle').value,
      observation: document.getElementById('fEvObservation').value,
      theory: document.getElementById('fEvTheory').value,
      confidence: document.getElementById('fEvConfidence').value
    },
    notes: readSimpleList('listNotes')
  };

  // status always kept even if somehow empty, so it renders correctly
  const cleanedOp = pruneEmpty(rawOp) || {};
  cleanedOp.status = rawOp.status;

  if(!token || !code || !cleanedOp.title){
    statusEl.innerHTML = '<div class="status-msg err">token, code, and a title are all required.</div>';
    return;
  }
  if(!isEdit && DATA.operations[code]){
    statusEl.innerHTML = '<div class="status-msg err">that code is already in use — pick another.</div>';
    return;
  }

  statusEl.innerHTML = '<div class="status-msg">saving…</div>';
  if(remember){ localStorage.setItem('gh_token', token); }
  else { localStorage.removeItem('gh_token'); }

  const newData = JSON.parse(JSON.stringify(DATA));

  if(isEdit && existingCode !== code){
    delete newData.operations[existingCode];
  }
  newData.operations[code] = cleanedOp;

  newData.phases.forEach(p => {
    p.ops = (p.ops || []).filter(c => c !== existingCode && c !== code);
  });
  newData.phases[phaseIdx].ops.push(code);

  try{
    await commitData(newData, `${isEdit ? 'Edit' : 'Add'} operation ${code}: ${cleanedOp.title}`, token);
    DATA = newData;
    currentOp = code;
    currentPart = null;
    currentSubOp = null;
    currentGroup = null;
    currentPhase = phaseIdx;
    statusEl.innerHTML = '<div class="status-msg ok">saved! the live site will update in about a minute.</div>';
    renderPhaseRail();
    renderMain();
    setTimeout(() => { document.getElementById('modalRoot').innerHTML = ''; }, 1200);
  }catch(e){
    statusEl.innerHTML = `<div class="status-msg err">${e.message}</div>`;
  }
}

async function deleteOperation(code){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <h3>Delete ${code}?</h3>
        <p style="font-size:13px;">This removes it from the archive for everyone. This can't be undone from here.</p>
        <div class="field">
          <label>Github token (write access to this repo)</label>
          <input type="password" id="dToken" placeholder="paste your token">
        </div>
        <div id="modalStatus"></div>
        <div class="modal-actions">
          <button id="cancelBtn">Cancel</button>
          <button id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  `;
  const savedToken = localStorage.getItem('gh_token');
  if(savedToken) document.getElementById('dToken').value = savedToken;

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') root.innerHTML = '';
  });
  document.getElementById('cancelBtn').addEventListener('click', () => root.innerHTML = '');
  document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
    const token = document.getElementById('dToken').value.trim();
    const statusEl = document.getElementById('modalStatus');
    if(!token){
      statusEl.innerHTML = '<div class="status-msg err">token required.</div>';
      return;
    }
    statusEl.innerHTML = '<div class="status-msg">deleting…</div>';
    const newData = JSON.parse(JSON.stringify(DATA));
    delete newData.operations[code];
    newData.phases.forEach(p => { p.ops = (p.ops || []).filter(c => c !== code); });
    try{
      await commitData(newData, `Delete operation ${code}`, token);
      DATA = newData;
      currentOp = null;
      currentPart = null;
      currentSubOp = null;
      currentGroup = null;
      statusEl.innerHTML = '<div class="status-msg ok">deleted.</div>';
      renderPhaseRail();
      renderMain();
      setTimeout(() => { document.getElementById('modalRoot').innerHTML = ''; }, 800);
    }catch(e){
      statusEl.innerHTML = `<div class="status-msg err">${e.message}</div>`;
    }
  });
}

loadData();
